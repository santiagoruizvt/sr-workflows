# Workflow reutilizable: genera un release vX.Y.Z al mergear un PR.
#
# - Toma el último tag con formato vX.Y.Z (o v0.0.0 si no hay ninguno).
# - Incrementa según la etiqueta del título del PR (#major, #minor, #patch).
# - El cuerpo del release son las líneas agregadas a las release notes en el PR.
name: Release (reusable)

on:
  workflow_call:
    inputs:
      release-notes-path:
        description: Ruta del archivo de release notes
        type: string
        default: RELEASE_NOTES.md
    outputs:
      version:
        description: Versión publicada (vacío si no se publicó)
        value: ${{ jobs.release.outputs.version }}

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: actions/github-script@v8
        env:
          NOTES_PATH: ${{ inputs.release-notes-path }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const notesPath = process.env.NOTES_PATH;

            // Tipo de incremento (si hay varias etiquetas, gana la mayor)
            const title = pr.title.toLowerCase();
            const bump = ['major', 'minor', 'patch'].find(b => new RegExp(`#${b}\\b`).test(title));
            if (!bump) {
              core.warning('El título del PR no tiene #major, #minor ni #patch: no se genera release.');
              return;
            }

            // Última versión publicada
            const tags = await github.paginate(github.rest.repos.listTags, { ...context.repo, per_page: 100 });
            const versions = tags
              .map(t => t.name.match(/^v(\d+)\.(\d+)\.(\d+)$/))
              .filter(Boolean)
              .map(m => m.slice(1).map(Number))
              .sort((a, b) => b[0] - a[0] || b[1] - a[1] || b[2] - a[2]);
            let [major, minor, patch] = versions[0] || [0, 0, 0];
            const previous = versions.length ? `v${major}.${minor}.${patch}` : null;

            if (bump === 'major') { major++; minor = 0; patch = 0; }
            else if (bump === 'minor') { minor++; patch = 0; }
            else { patch++; }
            const version = `v${major}.${minor}.${patch}`;

            // Release notes: líneas agregadas en este PR
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const notesFile = files.find(f => f.filename === notesPath);
            let notes = '';
            if (notesFile && notesFile.patch) {
              notes = notesFile.patch
                .split('\n')
                .filter(l => l.startsWith('+') && !l.startsWith('+++'))
                .map(l => l.slice(1))
                .join('\n')
                .trim();
            } else if (notesFile) {
              // Diff demasiado grande: usar el archivo completo
              const { data } = await github.rest.repos.getContent({ ...context.repo, path: notesPath, ref: pr.merge_commit_sha });
              notes = Buffer.from(data.content, 'base64').toString('utf8').trim();
            }

            const body = [
              notes || '_Sin release notes._',
              '',
              '---',
              `PR: #${pr.number} · ${previous ? `Cambios: ${previous}...${version}` : 'Primer release'}`,
            ].join('\n');

            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: version,
              target_commitish: pr.merge_commit_sha,
              name: version,
              body,
              make_latest: 'true',
            });

            core.setOutput('version', version);
            core.notice(`Release ${version} publicado (${previous || 'sin versión previa'} → ${version}, #${bump}).`);
            await core.summary.addHeading(`Release ${version}`, 2).addRaw(body).write();
