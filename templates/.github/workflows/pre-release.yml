# Gestionado por {{WORKFLOWS_REPO}} — no editar manualmente (el SYNC lo sobrescribe).
name: Pre-release

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [{{DEFAULT_BRANCH}}]

jobs:
  pre-release:
    permissions:
      contents: read
      pull-requests: read
    uses: {{REUSABLE_PATH}}/reusable-pre-release.yml{{REUSABLE_REF}}
